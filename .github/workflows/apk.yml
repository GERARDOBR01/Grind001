name: APK

# Compila el APK, lo prueba en un emulador Android y, en main, lo publica como Release:
# https://github.com/GERARDOBR01/Grind001/releases/latest/download/Serie.apk
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # el runner ya trae el SDK de Android (ANDROID_HOME); Gradle baja lo que falte
      - run: npm ci
      - run: npm run build && npx cap sync android
      - name: Compilar
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}0
        run: ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk Serie.apk
      - uses: actions/upload-artifact@v5
        with:
          name: Serie-apk
          path: Serie.apk

  emulador:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: Serie-apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./scripts/emulator-smoke.sh Serie.apk emulador
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: emulador
          path: emulador/

  release:
    needs: [build, emulador]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Serie-apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Serie (compilación ${{ github.run_number }})
          body: APK de Serie compilado desde ${{ github.sha }} y probado en un emulador Android. Descárgalo en el teléfono y ábrelo para instalar.
          files: Serie.apk
          make_latest: true
