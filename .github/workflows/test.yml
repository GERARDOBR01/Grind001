name: Pruebas

# Corre las pruebas de la app (gym, comida, movilidad y datos) en Chromium
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: true
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: reporte-pruebas
          path: |
            playwright-report/
            test-results/
