<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="200" viewBox="0 0 1280 200" role="img" aria-label="SERIE — Registra cada serie, ve cómo subes.">
  <defs>
    <pattern id="gm" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0v28" fill="none" stroke="#16181D" stroke-width="1"/>
    </pattern>
    <linearGradient id="fm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E0F12" stop-opacity="0"/>
      <stop offset="72%" stop-color="#0E0F12" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0E0F12" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="200" rx="12" fill="#0E0F12"/>
  <rect width="1280" height="200" rx="12" fill="url(#gm)"/>
  <rect width="1280" height="200" rx="12" fill="url(#fm)"/>

  <!-- los cuatro tipos de serie: calentamiento, normal, al fallo, drop set -->
  <rect x="56" y="46"  width="5" height="26" rx="2.5" fill="#E0A83A"/>
  <rect x="56" y="78"  width="5" height="26" rx="2.5" fill="#D9822B"/>
  <rect x="56" y="110" width="5" height="26" rx="2.5" fill="#E5484D"/>
  <rect x="56" y="142" width="5" height="26" rx="2.5" fill="#8E7CF0"/>

  <text x="90" y="88" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="700" fill="#F2F0EC" letter-spacing="1">SERIE</text>
  <text x="92" y="124" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8B9098">Registro de entreno: rutinas, series, descansos, récords y progreso.</text>
  <text x="92" y="158" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="12.5" fill="#4A505A" letter-spacing="2.4">HTML DE UN SOLO ARCHIVO · SIN BUILD · SIN BACKEND · SIN RED</text>
  <text x="1224" y="158" text-anchor="end" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="12.5" fill="#D9822B" letter-spacing="2">LO QUE NO SE ANOTA, NO SE SUPERA</text>
</svg>
